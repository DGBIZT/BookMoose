name: CI/CD Pipeline

on:
  push:
    branches: ["feature/library"]
  pull_request:
    branches: ["develop"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage flake8 black isort dj-database-url psycopg2-binary

    - name: Run linting
      run: |
        echo "=== Flake8 ==="
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=119
        echo "=== Black ==="
        black --check --diff --line-length=119 .
        echo "=== Isort ==="
        isort --check-only --profile=black .

    - name: Wait for PostgreSQL to be ready (with retry)
      run: |
        max_retries=20
        for i in $(seq 1 $max_retries); do
          if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
            echo "PostgreSQL is ready!"
            exit 0
          fi
          echo "Attempt $i/$max_retries: PostgreSQL not ready, waiting 5s..."
          sleep 5
        done
        echo "PostgreSQL failed to start after $max_retries attempts!"
        exit 1

    - name: Verify PostgreSQL connection
      env:
        PGPASSWORD: postgres
      run: |
        psql -h 127.0.0.1 -U postgres -d test_db -c "SELECT version();"

    - name: Run migrations
      env:
        SECRET_KEY: ${{ secrets.SECRET_KEY || 'test-secret-key-for-ci-cd' }}
        DEBUG: 'True'
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        CELERY_BROKER_URL: redis://localhost:6379/0
        CELERY_RESULT_BACKEND: redis://localhost:6379/0
        ALLOWED_HOSTS: localhost,127.0.0.1
      run: |
        python manage.py migrate

    - name: Run tests with coverage
      env:
        SECRET_KEY: ${{ secrets.SECRET_KEY || 'test-secret-key-for-ci-cd' }}
        DEBUG: 'True'
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        CELERY_BROKER_URL: redis://localhost:6379/0
        CELERY_RESULT_BACKEND: redis://localhost:6379/0
        ALLOWED_HOSTS: localhost,127.0.0.1
      run: |
        coverage run --source='.' manage.py test
        coverage report
        coverage xml

    - name: Build and test Docker images
      run: |
        docker-compose build
        docker-compose up -d
        sleep 30
        docker-compose ps
        docker-compose logs web
        docker-compose exec web python manage.py check --deploy
        docker-compose down
        docker network prune -f
        docker volume prune -f

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /BookMoose
          git pull origin feature/library
          docker-compose down
          docker-compose build --no-cache
          docker-compose up -d
          docker system prune -f --filter "until=24h"
          echo "🚀 Application deployed successfully!"

